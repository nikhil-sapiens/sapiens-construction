        <header>
            <nav>

        <main>
            <div class="calculator-title">Budget Calculator</div>

            <form id="budget-form" novalidate>
                <input name="area" type="number" min="1" placeholder="Enter plot area in square feet.">

                <input name="rooms" type="number" min="0" placeholder="Number of rooms (On each floor).">

                <input name="washrooms" type="number" min="0" placeholder="Number of washrooms (On each floor).">

                <input name="balconies" type="number" min="0" placeholder="Number of balconies (On each floor).">

                <input name="floors" type="number" min="1" placeholder="Number of floors.">

                <button type="button" onclick="calculateBudget()">Enter</button>
            </form>

            <section id="calculator-results" hidden>
                <h2>Recommended quantities</h2>
                <ul id="recommendations"></ul>
                <p id="estimated-total"></p>
            </section>
        </main>
